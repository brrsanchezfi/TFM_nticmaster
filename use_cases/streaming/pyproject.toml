[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather_events"
version = "0.1.0"
description = "Caso de uso streaming — dominio weather_events"
requires-python = ">=3.10"

# En Databricks pyspark lo aporta el runtime del cluster, por eso DKOps se
# instala sin extras: su única dependencia real es loguru.
# Versión fijada en platform/dkops_version.txt.
dependencies = [
  "dkops @ git+https://github.com/brrsanchezfi/DKOps.git@v0.3.0",
]

[project.optional-dependencies]
# Desarrollo y tests offline. El extra [local] de DKOps ya trae pyspark 3.5.3
# y delta-spark 3.2.0 con versiones exactas: no se repiten aquí para no
# arriesgar un desajuste con las que la librería declara.
local = [
  "dkops[local] @ git+https://github.com/brrsanchezfi/DKOps.git@v0.3.0",
  "pytest>=7.0",
]

# python_wheel_task invoca el job por su entry point, así que cada tarea del
# workflow necesita el suyo. Sin esto el bundle no puede desplegarse.
[project.scripts]
# El productor es una tarea más del workflow: deja el lote de eventos en la
# landing antes de que Auto Loader los recoja.
poll_api = "weather_events.jobs.poll_api:main"
ingest_bronze = "weather_events.jobs.ingest_bronze:main"
promote_silver = "weather_events.jobs.promote_silver:main"
build_gold = "weather_events.jobs.build_gold:main"

[tool.setuptools.packages.find]
where = ["src"]
