[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customers"
version = "0.1.0"
description = "Caso de uso CDC — dominio customers"
requires-python = ">=3.10"

# En Databricks pyspark lo aporta el runtime del cluster, por eso DKOps se
# instala sin extras: su única dependencia real es loguru.
# Versión fijada en platform/dkops_version.txt.
dependencies = [
  "dkops @ git+https://github.com/brrsanchezfi/DKOps.git@v0.3.4",
]

[project.optional-dependencies]
# Desarrollo y tests offline. El extra [local] de DKOps ya trae pyspark 3.5.3
# y delta-spark 3.2.0 con versiones exactas: no se repiten aquí para no
# arriesgar un desajuste con las que la librería declara.
local = [
  "dkops[local] @ git+https://github.com/brrsanchezfi/DKOps.git@v0.3.4",
  "pytest>=7.0",
]

# python_wheel_task invoca el job por su entry point, así que cada tarea del
# workflow necesita el suyo. Sin esto el bundle no puede desplegarse.
[project.scripts]
# El simulador del sistema origen es una tarea mas del workflow: deja los
# eventos I/U/D en la landing antes de que se ingieran.
simulate_source = "customers.jobs.simulate_source:main"
ingest_bronze = "customers.jobs.ingest_bronze:main"
promote_silver = "customers.jobs.promote_silver:main"
build_gold = "customers.jobs.build_gold:main"

[tool.setuptools.packages.find]
where = ["src"]
