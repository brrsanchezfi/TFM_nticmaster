[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orders"
version = "0.1.0"
description = "Caso de uso CDF — dominio orders"
requires-python = ">=3.10"

# En Databricks pyspark lo aporta el runtime del cluster, por eso DKOps se
# instala sin extras: su única dependencia real es loguru.
# Versión fijada en platform/dkops_version.txt.
dependencies = [
  "dkops @ git+https://github.com/brrsanchezfi/DKOps.git@v0.3.2",
]

[project.optional-dependencies]
# Desarrollo y tests offline. El extra [local] de DKOps ya trae pyspark 3.5.3
# y delta-spark 3.2.0 con versiones exactas: no se repiten aquí para no
# arriesgar un desajuste con las que la librería declara.
local = [
  "dkops[local] @ git+https://github.com/brrsanchezfi/DKOps.git@v0.3.2",
  "pytest>=7.0",
]

# python_wheel_task invoca el job por su entry point, así que cada tarea del
# workflow necesita el suyo. Sin esto el bundle no puede desplegarse.
#
# El caso CDF no ingiere desde una landing zone: su origen es una tabla Delta
# que ya está en Silver. Por eso sus tareas no son ingest/promote/gold, sino
# mutar la tabla origen y propagar sus cambios.
[project.scripts]
simulate_changes = "orders.jobs.simulate_changes:main"
propagate_cdf = "orders.jobs.propagate_cdf:main"

[tool.setuptools.packages.find]
where = ["src"]
