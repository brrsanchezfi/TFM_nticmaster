resources:
  dashboards:
    pedidos_cdf:
      display_name: "[${bundle.target}] TFM - Pedidos (CDF)"
      file_path: ../dashboards/pedidos_cdf.lvdash.json

      # SQL Warehouse serverless que ya existe en el workspace: se autosuspende
      # a los 10 minutos, así que el dashboard no genera coste mientras nadie
      # lo mira. No se crea un warehouse propio para el TFM.
      warehouse_id: ${var.warehouse_id}

      # El dashboard es una demostración: se regenera desde el JSON versionado.
      # Si alguien lo edita en la UI, el siguiente deploy sobreescribe esos
      # cambios en lugar de fallar.
      embed_credentials: false
