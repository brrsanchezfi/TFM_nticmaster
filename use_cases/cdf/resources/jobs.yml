resources:
  jobs:
    orders_cdf_pipeline:
      name: "[${bundle.target}] cdf_orders_pipeline"

      # Dos tareas encadenadas sobre un único job cluster: primero se muta la
      # tabla origen, después se propaga a Gold lo que el feed reporte.
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            # Single node: el volumen de la PoC no justifica workers, y así
            # solo se paga una VM. No se adjunta la policy "Job Compute"
            # porque prohíbe spark.databricks.cluster.profile.
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              proyecto: TFM-NTIC-Master
            # Requerido para usar Unity Catalog desde un wheel task.
            data_security_mode: SINGLE_USER
            azure_attributes:
              # En single-node la única VM es el driver, y Azure exige que el
              # driver sea on-demand: first_on_demand debe ser >= 1. Es decir,
              # aquí no hay ahorro por spot. Se deja declarado para que el
              # ahorro aplique si algún día se añaden workers.
              availability: SPOT_WITH_FALLBACK_AZURE
              first_on_demand: 1

      parameters:
        # Semilla del lote de cambios. Con 0 se deriva de la versión actual de
        # la tabla, de modo que cada ejecución produce un conjunto distinto de
        # INSERT/UPDATE/DELETE: es lo que permite encadenar varias pasadas en
        # una demostración y ver avanzar el puntero.
        # Un valor explícito fija el lote y lo hace reproducible.
        - name: lote
          default: "0"

      tasks:
        - task_key: simulate_changes
          job_cluster_key: pipeline_cluster
          python_wheel_task:
            package_name: orders
            entry_point: simulate_changes
            named_parameters:
              # El wheel vive en site-packages: la raíz del bundle (config/ y
              # contracts/) hay que pasarla explícitamente.
              bundle-root: ${workspace.file_path}
              config: config/config.dev.json
              lote: "{{job.parameters.lote}}"
          libraries:
            - whl: ../dist/*.whl

        - task_key: propagate_cdf
          depends_on:
            - task_key: simulate_changes
          job_cluster_key: pipeline_cluster
          python_wheel_task:
            package_name: orders
            entry_point: propagate_cdf
            named_parameters:
              bundle-root: ${workspace.file_path}
              config: config/config.dev.json
          libraries:
            - whl: ../dist/*.whl
